{% extends "layout/basic.html" %}

{% block content %}
<div class="row">
  <div class="columns">
    <div class="column medium-9">
      <div class="section">
        <div class="section__header">
          <h1 class="section__title">{{ _('Bulk Submit') }} - {{ tdoc.title }}</h1>
        </div>
        <div class="section__body">
          <p>{{ _('Two layouts are supported: 1) <uname>/<Label>.<ext> folders for per-player submission; 2) flat Label.ext files assigned to the user below (or you).') }}</p>
          <table class="data-table">
            <thead>
              <tr>
                <th>{{ _('Label') }}</th>
                <th>{{ _('Problem') }}</th>
              </tr>
            </thead>
            <tbody>
              {% for p in problems %}
              <tr>
                <td><b>{{ p.label }}</b></td>
                <td>{{ p.title }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        <div class="section__body">
          <form id="bulk-submit-form">
            <div class="row">
              <div class="columns medium-6 form__item">
                <label>{{ _('Select Zip') }}</label>
                <input type="file" name="file" accept=".zip" required />
              </div>
            </div>
            <div class="row">
              <div class="columns medium-6 form__item">
                <label>{{ _('Default assign to (optional)') }}</label>
                <input type="text" name="defaultUser" class="textbox" placeholder="{{ UserContext.uname }}" />
              </div>
            </div>
            <label class="checkbox">
              <input type="checkbox" name="dryrun" value="true" />
              {{ _('Dry Run') }}
            </label>
            <button type="submit" class="primary rounded button">{{ _('Submit') }}</button>
          </form>
          <div id="bulk-submit-result"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
